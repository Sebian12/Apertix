<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapPress Demo</title>

    <link rel="stylesheet" href="../styles/output.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="shortcut icon" href="../assets/favicon.png" type="image/x-icon">
</head>
<body>
    <header class="sticky top-0 z-50 border-b border-line bg-bg/85 backdrop-blur-md">
        <div class="wrap flex flex-col items-center gap-1 py-3 lg:h-[84px] lg:flex-row lg:justify-between lg:gap-8 lg:py-0">
            <a href="../index.html"><img src="../assets/logo.png" alt="Apertix Logo" class="block h-16 w-auto lg:h-[110px]"></a>
            <nav class="max-w-full overflow-x-auto">
                <ul class="flex gap-5 whitespace-nowrap text-sm lg:gap-7">
                    <li><a class="nav-link" href="snappress.html">SnapPress</a></li>
                    <li><a class="nav-link" href="snaprename.html">SnapRename</a></li>
                    <li><a class="nav-link" href="download.html">Downloads</a></li>
                    <li><a class="nav-link" href="roadmap.html">Roadmap</a></li>
                    <li><a class="nav-link" href="FAQ.html">FAQ</a></li>
                    <li><a class="nav-link" href="https://ko-fi.com/sebian1221" target="_blank">Ko-fi</a></li>
                    <li><a class="nav-link" href="https://github.com/Sebian12" target="_blank">GitHub</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-hero !pt-[72px] !pb-12">
            <div class="wrap">
                <span class="eyebrow">APERTIX · WEB DEMO</span>
                <h1 class="page-title text-[clamp(2.4rem,5vw,3.4rem)]">SnapPress Web</h1>
                <p class="page-lead">Try SnapPress right in your browser — drop a few images below to see it in action.</p>
            </div>
        </section>

        <div class="wrap mt-12">
            <div id="dropzone">
                <label for="fileInput" class="flex min-h-[140px] w-full cursor-pointer items-center justify-center rounded-2xl border border-dashed border-line-strong bg-surface p-8 text-center text-muted transition-colors hover:border-accent hover:text-ink">
                    Click to select files
                    <input type="file" id="fileInput" multiple accept="image/*" hidden>
                </label>
            </div>
            <p id="counter" class="mt-3 text-right font-mono text-xs text-faint">0 / 10 files</p>
            <div id="results"></div>
            <button class="btn btn-primary mt-4" id="downloadBtn">Download all</button>
        </div>
    </main>

    <footer class="mt-20 pb-8 text-center">
        <p class="font-mono text-xs text-faint">Current Version: v1.0.0</p>
    </footer>
    <script src="../src/SnapPress_demo.js"></script>
</body>
</html>
